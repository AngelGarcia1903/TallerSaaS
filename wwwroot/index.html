<!doctype html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS - Taller Mecánico</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // Paleta Cálida Personalizada basada en tu imagen
              brand: {
                purple: "#4a2545",
                burgundy: "#8c1c40",
                cherry: "#c71543",
                orange: "#f05b32",
                yellow: "#f9b21a",
                // Tonos grises para el modo oscuro elegante
                darkbg: "#121212",
                darkcard: "#1e1e1e",
                darkborder: "#2d2d2d",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-gray-50 text-gray-900 dark:bg-brand-darkbg dark:text-gray-100 transition-colors duration-300 min-h-screen p-4 md:p-8 font-sans"
  >
    <div class="max-w-5xl mx-auto space-y-6">
      <header
        class="flex flex-col md:flex-row justify-between items-center bg-white dark:bg-brand-darkcard p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-brand-darkborder transition-colors"
      >
        <div class="flex items-center gap-3 mb-4 md:mb-0">
          <div
            class="bg-gradient-to-br from-brand-orange to-brand-cherry text-white p-2 rounded-xl"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              ></path>
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              ></path>
            </svg>
          </div>
          <h1 class="text-2xl font-bold tracking-tight">
            AutoTrace
            <span class="text-brand-orange dark:text-brand-yellow">SaaS</span>
          </h1>
        </div>

        <button
          id="btnTema"
          onclick="toggleTema()"
          class="bg-gray-100 dark:bg-brand-darkbg text-gray-700 dark:text-gray-300 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 dark:hover:bg-gray-800 transition flex items-center gap-2 border border-transparent dark:border-brand-darkborder"
        >
          <span>🌙</span> <span id="textoTema">Modo Oscuro</span>
        </button>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div
          class="bg-white dark:bg-brand-darkcard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-brand-darkborder transition-colors h-fit"
        >
          <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
            <span class="w-2 h-6 bg-brand-yellow rounded-full"></span>
            Nuevo Ingreso
          </h2>

          <form
            id="formVehiculo"
            class="space-y-4"
            onsubmit="registrarAuto(event)"
          >
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Número de Placa</label
              >
              <input
                type="text"
                id="placa"
                required
                class="w-full px-4 py-2 bg-gray-50 dark:bg-brand-darkbg border border-gray-200 dark:border-brand-darkborder rounded-lg focus:ring-2 focus:ring-brand-orange focus:border-transparent outline-none transition text-gray-900 dark:text-white uppercase"
                placeholder="EJ: ABC-123"
              />
            </div>

            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Modelo / Vehículo</label
              >
              <input
                type="text"
                id="modelo"
                required
                class="w-full px-4 py-2 bg-gray-50 dark:bg-brand-darkbg border border-gray-200 dark:border-brand-darkborder rounded-lg focus:ring-2 focus:ring-brand-orange focus:border-transparent outline-none transition text-gray-900 dark:text-white"
                placeholder="EJ: Honda Civic 2020"
              />
            </div>

            <div class="pt-2">
              <button
                type="submit"
                class="w-full bg-brand-cherry hover:bg-brand-burgundy text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md shadow-brand-cherry/30 flex justify-center items-center gap-2"
              >
                <span>Ingresar al Taller</span>
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v16m8-8H4"
                  ></path>
                </svg>
              </button>
            </div>
          </form>
        </div>

        <div
          class="lg:col-span-2 bg-white dark:bg-brand-darkcard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-brand-darkborder transition-colors"
        >
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-bold flex items-center gap-2">
              <span class="w-2 h-6 bg-brand-orange rounded-full"></span>
              Vehículos en Servicio
            </h2>
            <span
              class="bg-gray-100 dark:bg-brand-darkbg text-gray-600 dark:text-gray-400 text-xs px-3 py-1 rounded-full font-medium border border-gray-200 dark:border-brand-darkborder"
              >Taller Pepe (#1)</span
            >
          </div>

          <div
            id="lista-vehiculos"
            class="grid grid-cols-1 sm:grid-cols-2 gap-4"
          >
            <p class="text-gray-500 animate-pulse col-span-full">
              Cargando base de datos...
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      // --- 1. MODO OSCURO ---
      function toggleTema() {
        const html = document.documentElement;
        const iconoTema = document.getElementById("btnTema").firstElementChild;
        const textoTema = document.getElementById("textoTema");

        html.classList.toggle("dark");

        if (html.classList.contains("dark")) {
          textoTema.innerText = "Modo Claro";
          iconoTema.innerText = "☀️";
        } else {
          textoTema.innerText = "Modo Oscuro";
          iconoTema.innerText = "🌙";
        }
      }

      // --- 2. CONFIGURACIÓN API ---
      // (Asegúrate de que este sea el ID de tu cliente, por ahora forzamos el Taller 1)
      const ID_TALLER_ACTUAL = 1;
      const urlAPI = "http://localhost:5011/api";

      // --- 3. OBTENER Y DIBUJAR AUTOS (GET) ---
      async function cargarVehiculos() {
        try {
          const respuesta = await fetch(
            `${urlAPI}/talleres/${ID_TALLER_ACTUAL}/vehiculos`,
          );
          const vehiculos = await respuesta.json();
          const contenedor = document.getElementById("lista-vehiculos");
          contenedor.innerHTML = "";

          if (vehiculos.length === 0) {
            contenedor.innerHTML = `
                        <div class="col-span-full text-center py-12 px-4 rounded-xl border border-dashed border-gray-300 dark:border-brand-darkborder">
                            <p class="text-gray-500 dark:text-gray-400">El taller está vacío.</p>
                            <p class="text-sm text-gray-400 dark:text-gray-500 mt-1">Registra un auto nuevo en el panel izquierdo.</p>
                        </div>`;
            return;
          }

          vehiculos.forEach((auto) => {
            const isRoto = auto.enMantenimiento;

            // Colores de los estados adaptados a la paleta y modo oscuro
            const bordeClase = isRoto
              ? "border-brand-cherry"
              : "border-emerald-500";
            const badgeBg = isRoto
              ? "bg-brand-cherry/10 dark:bg-brand-cherry/20"
              : "bg-emerald-100 dark:bg-emerald-900/30";
            const badgeText = isRoto
              ? "text-brand-cherry dark:text-red-400"
              : "text-emerald-700 dark:text-emerald-400";
            const textoEstado = isRoto
              ? "🛠️ En Reparación"
              : "✅ Listo para entrega";

            const tarjeta = `
                        <div class="p-4 rounded-xl border-l-4 ${bordeClase} bg-gray-50 dark:bg-brand-darkbg border-y border-r border-gray-200 dark:border-brand-darkborder hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-bold uppercase tracking-wide text-gray-900 dark:text-white">${auto.placa}</h3>
                                <button onclick="cambiarEstado(${auto.id}, ${!auto.enMantenimiento})" class="text-gray-400 hover:text-brand-orange transition" title="Cambiar Estado">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                </button>
                            </div>
                            <p class="text-sm text-gray-600 dark:text-gray-400 mb-4 font-medium">${auto.modelo}</p>
                            <span class="px-2.5 py-1 rounded-md text-xs font-bold ${badgeBg} ${badgeText} tracking-wide">
                                ${textoEstado}
                            </span>
                        </div>
                    `;
            contenedor.innerHTML += tarjeta;
          });
        } catch (error) {
          console.error(error);
        }
      }

      // --- 4. REGISTRAR UN AUTO NUEVO (POST) ---
      async function registrarAuto(event) {
        event.preventDefault(); // Evita que la página recargue bruscamente

        // Leemos lo que el usuario escribió
        const inputPlaca = document.getElementById("placa").value;
        const inputModelo = document.getElementById("modelo").value;

        // Preparamos el paquete JSON
        const nuevoAuto = {
          placa: inputPlaca,
          modelo: inputModelo,
          enMantenimiento: true, // Entra directo a reparación
          tallerId: ID_TALLER_ACTUAL,
        };

        try {
          // Enviamos la petición POST a C#
          await fetch(`${urlAPI}/vehiculos`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(nuevoAuto),
          });

          // Limpiamos las cajas de texto
          document.getElementById("formVehiculo").reset();

          // Recargamos la lista para que aparezca el nuevo auto automáticamente
          cargarVehiculos();
        } catch (error) {
          alert("Hubo un error al guardar el vehículo.");
          console.error(error);
        }
      }

      // Arrancamos la carga inicial
      cargarVehiculos();
    </script>
  </body>
</html>
